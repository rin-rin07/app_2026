<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doll's Music Box</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="header">
      <h1 id="page-title">Doll's Music Box</h1>
      <nav>menu</nav>
    </header>

    <main class="song-card">
      <div id="error-message" class="error-message" style="display: none"></div>

      <form id="song-form" class="input-area">
        <input
          type="text"
          id="song-input"
          class="song-input"
          placeholder="新しい曲名を入力"
          maxlength="100"
          autocomplete="off"
        />
        <input
        type="text"
        id="artist-input"
        class="song-input"
        placeholder="アーティスト名を入力"
        maxlength="100"
        autocomplete="off"
        />
        <button type="submit" class="song-button">追加</button>
      </form>

      <ul id="song-list" class="song-list"></ul>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Doll's Music Box</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
